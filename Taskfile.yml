# https://taskfile.dev
version: '3'

silent: true

vars:
  GO_MODULE: github.com/dvadert/chat-service
  GO_FILES:
    sh: find . -type f -name '*.go' -not -path "./vendor/*" -not -path "*.gen.go" | tr "\n" " "
  TOOLS_BIN: "{{.ROOT_DIR}}/tools"

  GOLANGCI_LINT_VERSION: v2.15.0
  GOLANGCI_LINT_CACHE:
    sh: echo "$HOME/Library/Caches/golangci-lint"

  # Pinned versions only — never @latest.
  DEV_TOOLS: |
    github.com/daixiang0/gci@v0.13.5
    mvdan.cc/gofumpt@v0.7.0
    github.com/kazhuravlev/options-gen/cmd/options-gen@v0.60.0

tasks:
  default:
    cmds:
      - task: tidy
      - task: fmt
      - task: lint
      - task: tests
      - task: build

  tidy:
    cmds:
      - echo "- Tidy"
      - go mod tidy
      - task: vendor

  vendor:
    cmds:
      - echo "- Vendor"
      - go mod vendor

  fmt:
    deps: [dev-tools:install]
    cmds:
      - echo "- Format"
      - "{{.TOOLS_BIN}}/gofumpt -l -w {{.GO_FILES}}"
      - "{{.TOOLS_BIN}}/gci write --skip-generated -s standard -s default -s 'prefix({{.GO_MODULE}})' {{.GO_FILES}}"

  lint:
    cmds:
      - echo "- Lint"
      - mkdir -p {{.GOLANGCI_LINT_CACHE}}
      - task: lint:cmd
        vars: {CLI_ARGS: "run -v --fix --timeout=5m ./..."}

  lint:cmd:
    cmds:
      - |
        docker run --rm \
          -v "$(pwd):/app" -w /app \
          -v "{{.GOLANGCI_LINT_CACHE}}:/root/.cache" \
          -e GOFLAGS="-buildvcs=false" \
          golangci/golangci-lint:{{.GOLANGCI_LINT_VERSION}} \
          golangci-lint {{.CLI_ARGS}}

  tests:
    cmds:
      - echo "- Tests"
      - go test -race ./...

  build:
    cmds:
      - echo "- Build"
      - go build ./cmd/chat-service

  dev-tools:install:
    cmds:
      - echo "- Install dev tools"
      - mkdir -p "{{.TOOLS_BIN}}"
      - |
        printf '%s\n' "{{.DEV_TOOLS}}" | while IFS= read -r pkg; do
          pkg="$(printf '%s' "$pkg" | tr -d '[:space:]')"
          [ -z "$pkg" ] && continue
          echo "  go install $pkg"
          GOBIN="{{.TOOLS_BIN}}" go install "$pkg"
        done

  generate:
    deps: [dev-tools:install]
    cmds:
      - echo "Run go generate..."
      - PATH="{{.TOOLS_BIN}}:${PATH}" go generate ./...
